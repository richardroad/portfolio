<!doctype html>
<html lang="ru" data-resolution="portrait">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920"><title>RR reel</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Onest;font-weight:500;src:url(assets/fonts/onest-cyrillic-500-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:Onest;font-weight:500;src:url(assets/fonts/onest-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:PfI;font-style:italic;src:url(assets/fonts/playfair-display-cyrillic-400-italic.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:PfI;font-style:italic;src:url(assets/fonts/playfair-display-latin-400-italic.woff2);unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.foot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card{position:absolute;inset:0;background:#0b0b0b;z-index:5;display:flex;align-items:center;justify-content:center;transform:translateY(1920px)}
.card .frame{position:absolute;inset:46px;border:1px solid #c9a45c40}
.card .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 38% at 50% 50%,#2a221766,transparent 70%)}
.orn{position:absolute;top:760px;left:505px;width:70px}
.txt{position:relative;font-family:Onest;font-weight:500;font-size:86px;line-height:1.14;letter-spacing:-.025em;color:#f2ece2;text-align:center}
.ln{overflow:hidden;padding-bottom:10px}
.w{display:inline-block;overflow:hidden;vertical-align:bottom}
.wi{display:inline-block}
.acc{font-family:PfI;font-style:italic;color:#c9a45c;font-size:1.12em;letter-spacing:0}
.rule{position:absolute;top:1150px;left:230px;width:620px;height:12px}
.rule i{position:absolute;top:5px;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#c9a45c,transparent)}
.rule b{position:absolute;top:0;left:304px;width:12px;height:12px;background:#c9a45c;transform:rotate(45deg)}
#endtxt{position:absolute;left:0;right:0;top:1150px;text-align:center;z-index:6}
.e1{font-family:Onest;font-weight:500;font-size:64px;letter-spacing:-.02em;color:#f2ece2}
.e2{margin-top:18px;font-family:Onest;font-weight:500;font-size:46px;color:#ffffffb0}
#grainwrap{position:absolute;inset:0;z-index:50;overflow:hidden;pointer-events:none;opacity:.07;mix-blend-mode:screen}
#grain{position:absolute;left:0;top:0;width:1300px;height:2140px;background:url(assets/grain.png);background-size:270px}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1080" data-height="1920" data-fps="30">

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.set("#c0",{y:0},0);
