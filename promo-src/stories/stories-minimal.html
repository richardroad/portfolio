<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Corm; src: url(cormorant-italic.ttf); font-style: italic; }
@font-face { font-family: Noto; src: url(noto.ttf); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; }
.s { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #f2ece2; margin-bottom: 20px; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.shade { position: absolute; inset: 0; }
.t { position: absolute; left: 0; right: 0; text-align: center; font-family: Corm; font-style: italic; font-size: 96px; line-height: 1.05; }
.small { position: absolute; left: 0; right: 0; text-align: center; font-family: Noto; font-size: 40px; letter-spacing: .04em; color: #ffffffa0; }
</style></head><body>

<div class="s" id="s1">
  <div class="bg" style="background-image:url(bg-shatter.jpg); transform: scale(1.35); background-position: 50% 40%"></div>
  <div class="shade" style="background: linear-gradient(transparent 45%, #000 78%)"></div>
  <div class="t" style="bottom: 420px">Разбил старое<br>портфолио.</div>
</div>

<div class="s" id="s2">
  <div class="bg" style="background-image:url(bg-shards.jpg); transform: scale(1.25)"></div>
  <div class="shade" style="background: radial-gradient(ellipse at 50% 42%, transparent 20%, #000c 70%)"></div>
  <div class="t" style="top: 300px">Сколько ушло<br>на новый сайт?</div>
</div>

<div class="s" id="s3">
  <div class="bg" style="background-image:url(saint-face.webp); background-position: 50% 30%"></div>
  <div class="shade" style="background: linear-gradient(transparent 50%, #000 82%)"></div>
  <div class="t" style="bottom: 420px">AI production</div>
</div>

<div class="s" id="s4">
  <div class="bg" style="background-image:url(puk-face.webp); background-position: 50% 20%; filter: brightness(.85)"></div>
  <div class="shade" style="background: linear-gradient(transparent 50%, #000 82%)"></div>
  <div class="t" style="bottom: 420px">Photography</div>
</div>

<div class="s" id="s5">
  <div class="bg" style="background-image:url(embers-rose.webp); background-position: 50% 45%; transform: scale(1.3) translateY(-60px)"></div>
  <div class="shade" style="background: radial-gradient(circle at 54% 40%, transparent 14%, #000c 42%, #000 68%)"></div>
  <div class="t" style="bottom: 420px">Art &amp; Design</div>
</div>

<div class="s" id="s6">
  <div class="bg" style="background-image:url(bg-home.jpg); transform: scale(1.5); transform-origin: 50% 0%; background-position: 50% 0%"></div>
  <div class="shade" style="background: linear-gradient(transparent 30%, #000 47%)"></div>
  <div class="t" style="top: 1060px">Портфолио онлайн.</div>
</div>

<div class="s" id="s7">
  <img src="rr-chrome-mark-cut.webp" style="position:absolute; top: 520px; left: 50%; width: 300px; transform: translateX(-50%)">
  <div class="t" style="top: 920px">Хочешь такой же?</div>
  <div class="small" style="top: 1080px">напиши «сайт» в директ</div>
</div>

</body></html>
